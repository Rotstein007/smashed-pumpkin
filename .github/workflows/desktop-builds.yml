name: Linux Builds

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: linux-builds-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-meta:
    name: Resolve release metadata
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version and release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(sed -n "s/.*version: '\\([^']*\\)'.*/\\1/p" meson.build | head -n1)"
          if [[ -z "${VERSION}" ]]; then
            echo "Could not resolve app version from meson.build"
            exit 1
          fi

          python3 build-aux/release-notes.py "${VERSION}" >/dev/null

          TAG="v${VERSION}"
          if [[ "${GITHUB_REF}" == refs/tags/v* && "${GITHUB_REF_NAME}" != "${TAG}" ]]; then
            echo "Tag version (${GITHUB_REF_NAME}) does not match meson.build version (${VERSION})."
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux ${{ matrix.arch }} build and tests
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang meson ninja-build pkg-config gettext locales \
            libadwaita-1-dev libsoup-3.0-dev libgtk-3-dev \
            libayatana-appindicator3-dev libx11-dev libxtst-dev \
            xvfb openbox xauth x11-utils
          sudo locale-gen en_US.UTF-8

      - name: Configure
        run: meson setup buildDir --buildtype=release

      - name: Build
        run: meson compile -C buildDir

      - name: Test
        run: meson test -C buildDir --print-errorlogs

      - name: Headless UI regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p buildDir/meson-logs/ui
          for scope in all minimap worlds-map-access releases i18n-boundaries i18n-loading i18n-chinese language-settings; do
            bash build-aux/test-window-ui-headless.sh buildDir "$scope" \
              2>&1 | tee "buildDir/meson-logs/ui/${scope}.log"
          done

      - name: Address and undefined behavior sanitizers
        if: matrix.arch == 'x86_64'
        env:
          CC: clang
        run: |
          meson setup build-sanitize --buildtype=debug \
            -Db_sanitize=address,undefined -Db_lundef=false
          meson test -C build-sanitize --print-errorlogs

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: linux-test-logs-${{ matrix.arch }}
          path: |
            buildDir/meson-logs/
            build-sanitize/meson-logs/
          if-no-files-found: ignore
          retention-days: 14

  bridge-sources:
    name: Package and verify offline minimap bridge sources
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust with the WASI target
        run: rustup toolchain install 1.97.1 --profile minimal --target wasm32-wasip2

      - name: Package sources and verify an offline build
        run: bash build-aux/package-map-bridge.sh "${RUNNER_TEMP}/bridge-sources"

      - name: Install app build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential meson ninja-build pkg-config gettext locales \
            libadwaita-1-dev libsoup-3.0-dev libgtk-3-dev \
            libayatana-appindicator3-dev libx11-dev
          sudo locale-gen en_US.UTF-8

      - name: Verify app integration with the source-built bridge
        env:
          CARGO_HOME: ${{ runner.temp }}/bridge-cargo-home
        run: |
          set -euo pipefail
          mkdir -p "${CARGO_HOME}"
          tar -xJf "${RUNNER_TEMP}"/bridge-sources/*.tar.xz \
            --strip-components=1 -C plugins/map-bridge
          meson setup build-bridge --buildtype=release -Dbuild_minimap_bridge=true
          meson compile -C build-bridge
          meson test -C build-bridge --print-errorlogs

      - name: Upload bridge sources
        uses: actions/upload-artifact@v6
        with:
          name: map-bridge-sources
          path: |
            ${{ runner.temp }}/bridge-sources/*.tar.xz
            ${{ runner.temp }}/bridge-sources/*.sha256
          if-no-files-found: error
          retention-days: 14

  flatpak:
    name: Flatpak ${{ matrix.flatpak_arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - flatpak_arch: x86_64
            runner: ubuntu-latest
          - flatpak_arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          export XDG_RUNTIME_DIR=/tmp/xdg-runtime-$UID
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user remote-add --if-not-exists flathub-beta https://dl.flathub.org/beta-repo/flathub-beta.flatpakrepo

      - name: Build Flatpak
        run: |
          export XDG_RUNTIME_DIR=/tmp/xdg-runtime-$UID
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          flatpak-builder \
            --user \
            --repo=flatpak-repo \
            --install-deps-from=flathub \
            --install-deps-from=flathub-beta \
            --force-clean \
            --disable-rofiles-fuse \
            build-dir \
            build-aux/flatpak/dev.rotstein.SmashedPumpkin.json

      - name: Bundle Flatpak
        run: |
          flatpak build-bundle \
            --arch=${{ matrix.flatpak_arch }} \
            flatpak-repo \
            SmashedPumpkin-${{ matrix.flatpak_arch }}.flatpak \
            dev.rotstein.SmashedPumpkin \
            master

      - name: Upload Flatpak Bundle
        uses: actions/upload-artifact@v6
        with:
          name: SmashedPumpkin-${{ matrix.flatpak_arch }}.flatpak
          path: SmashedPumpkin-${{ matrix.flatpak_arch }}.flatpak
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Flatpak release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [release-meta, linux, flatpak, bridge-sources]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare localized release notes
        env:
          RELEASE_VERSION: ${{ needs.release-meta.outputs.version }}
        run: python3 build-aux/release-notes.py "${RELEASE_VERSION}" > "${RUNNER_TEMP}/release-notes.md"

      - name: Download Flatpak bundles
        uses: actions/download-artifact@v7
        with:
          pattern: SmashedPumpkin-*.flatpak
          path: publish-assets
          merge-multiple: true

      - name: Download bridge sources
        uses: actions/download-artifact@v7
        with:
          name: map-bridge-sources
          path: publish-assets

      - name: Verify release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-meta.outputs.version }}
        run: |
          set -euo pipefail
          for arch in x86_64 aarch64; do
            test -s "publish-assets/SmashedPumpkin-${arch}.flatpak"
          done
          cd publish-assets
          test -s "SmashedPumpkin-${RELEASE_VERSION}-map-bridge-sources.tar.xz"
          sha256sum --check "SmashedPumpkin-${RELEASE_VERSION}-map-bridge-sources.tar.xz.sha256"

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-meta.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" publish-assets/* --clobber
            gh release edit "${RELEASE_TAG}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md" \
              --draft=false
          else
            gh release create "${RELEASE_TAG}" publish-assets/* \
              --title "${RELEASE_TAG}" \
              --verify-tag \
              --notes-file "${RUNNER_TEMP}/release-notes.md"
          fi

